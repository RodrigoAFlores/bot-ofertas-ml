name: Prueba reel

# Prueba temporal: arma el reel con las ofertas actuales y lo deja para descargar. No publica nada.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar lo necesario
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -q > /dev/null || true
          sudo apt-get install -y -q ffmpeg fonts-inter > /dev/null
      - name: Armar el reel
        run: node reel.mjs
      - name: Sacar 4 cuadros para revisar
        run: |
          V=$(ls docs/reels/*.mp4 | head -1)
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact "$V"
          for s in 1 4 10 19; do ffmpeg -v error -ss $s -i "$V" -frames:v 1 -vf scale=360:-1 "cuadro-$s.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: reel-prueba
          path: |
            docs/reels/*.mp4
            docs/reel.json
            cuadro-*.png
