name: Publicar en Instagram

# GitHub no garantiza la hora exacta de las tareas programadas: a veces las atrasa o se las salta,
# sobre todo las que corren justo a la hora en punto. Por eso corre cada 20 minutos (en minutos
# poco usados) y publicar.py decide si toca: solo entre 9:00 y 22:59 de Chile y con al menos
# 50 minutos desde el último post.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: publicar

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar el siguiente post (si toca)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MINUTOS_ENTRE_POSTS: "9"   # cron-job.org la llama cada 10 minutos
        run: python3 publicar.py siguiente
      - name: Guardar el registro de lo publicado
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add data/publicado.json
          git diff --cached --quiet || (git commit -m "Registro de publicación" && git pull --rebase -q && git push -q)
